<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokomon Collection</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--accent:#ff3d8b;--off:#e6e3dc}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--card:#212124;--ink:#f2f2f3;--mute:#9a9aa1;--line:#34343a;--off:#3a3a40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:18px;margin:0 8px 0 0}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
#stats{color:var(--mute);margin-left:auto}
.note{margin:16px 16px 0;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px}.note ul{margin:6px 0 0;padding-left:20px}.note li{margin:2px 0}.note b{color:var(--accent)}main{padding:8px 16px 24px}section{margin-top:18px}section h2{font-size:17px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}section h2 span{font-size:13px;font-weight:400;color:var(--mute)}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in;background:var(--off)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:18px}
.t{font-size:15px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.t a{color:inherit;text-decoration:none}.t a:hover{text-decoration:underline}
.r{display:flex;gap:6px;align-items:center}
.r button{flex:1 1 0;max-width:38px;min-width:0;height:34px;padding:0;border-radius:9px;font-size:15px;font-weight:700;background:var(--off);border-color:transparent;color:var(--mute)}.r button:hover{background:#ffd1e3;color:#1d1d1f;border-color:transparent}
.r button.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(255,61,139,.45)}
.r .clr{flex:none;max-width:none;width:auto;padding:0 8px;font-size:13px;margin-left:auto;background:none;font-weight:400}
.score{font-size:12px;color:var(--mute)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
#lb img{max-width:92vw;max-height:92vh;border-radius:8px}
</style>
</head>
<body>
<header>
  <h1>Pokomon 3D Print Collection</h1>
  <input id="q" type="search" placeholder="Search…">
  <select id="sort">
    <option value="orig">Original order</option>
    <option value="high">Highest rated</option>
    <option value="low">Lowest rated</option>
    <option value="az">A–Z</option>
  </select>
  <select id="cat"><option value="all">All categories</option></select>
  <select id="flt">
    <option value="all">All</option>
    <option value="un">Unrated only</option>
    <option value="rated">Rated only</option>
    <option value="top">7–8 only</option>
  </select>
  <button id="csv">Export CSV</button>
  <button id="reset">Reset</button>
  <span id="stats"></span>
</header>
<aside class="note"><strong>How to rate (1–8)</strong>
  <ul>
    <li><b>1</b> — no one is going to buy this</li>
    <li><b>6</b> — I like it, but I'm unsure others will</li>
    <li><b>8</b> — I know for a fact this is going to sell</li>
  </ul></aside>

rame", "img": "img/2618843.webp", "ok": true, "cat": "Card stands & holders"}];</script>
<script>
const KEY='pokomon-ratings-v1';
let ratings={};
try{ratings=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ratings))}catch(e){}};
const $=id=>document.getElementById(id);
const grid=$('grid');
const CATS=['Keychains','Figures & toys','Card stands & holders','3D cards','Storage & organizers','Decor & misc','Poké Balls','Games','Other'];
const cs=$('cat');CATS.filter(c=>ITEMS.some(i=>i.cat===c)).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=`${c} (${ITEMS.filter(i=>i.cat===c).length})`;cs.appendChild(o)});

function render(){
  const q=$('q').value.toLowerCase(), f=$('flt').value, s=$('sort').value;
  let list=ITEMS.map((it,i)=>({...it,i,r:ratings[it.id]||0}))
    .filter(it=>it.title.toLowerCase().includes(q))
    .filter(it=>f==='all'||(f==='un'&&!it.r)||(f==='rated'&&it.r)||(f==='top'&&it.r>=7));
  if(s==='high')list.sort((a,b)=>b.r-a.r||a.i-b.i);
  if(s==='low')list.sort((a,b)=>(a.r||99)-(b.r||99)||a.i-b.i);
  if(s==='az')list.sort((a,b)=>a.title.localeCompare(b.title));
  grid.innerHTML='';
  const cf=$('cat').value; if(cf!=='all')list=list.filter(it=>it.cat===cf);
  const groups={};for(const it of list)(groups[it.cat]=groups[it.cat]||[]).push(it);
  for(const cat of CATS.filter(c=>groups[c])){
   const sec=document.createElement('section');const L=groups[cat];const avg=L.filter(x=>x.r);
   sec.innerHTML=`<h2></h2><div class="g"></div>`;sec.querySelector('h2').innerHTML=`${cat} <span>${L.length} models${avg.length?' · avg '+(avg.reduce((a,b)=>a+b.r,0)/avg.length).toFixed(1)+'/8':''}</span>`;
   const holder=sec.querySelector('.g');grid.appendChild(sec);
  for(const it of L){
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<img loading="lazy" src="${it.img}" alt=""><div class="body"><div class="t"><a href="${it.url}" target="_blank" rel="noopener"></a></div><div class="r"></div></div>`;
    c.querySelector('a').textContent=it.title;
    c.querySelector('img').onclick=()=>{$('lb').querySelector('img').src=it.img;$('lb').style.display='flex'};
    const r=c.querySelector('.r');
    for(let n=1;n<=8;n++){
      const b=document.createElement('button');b.textContent=n;
      if(n<=it.r)b.className='on';
      b.title=`Rate ${n}/8`;
      b.onclick=()=>{ratings[it.id]=(ratings[it.id]===n?0:n);save();render();};
      r.appendChild(b);
    }
    const x=document.createElement('button');x.className='clr';x.textContent=it.r?`${it.r}/8 ✕`:'';
    if(it.r)x.onclick=()=>{delete ratings[it.id];save();render();};else x.style.display='none';
    r.appendChild(x);
    holder.appendChild(c);
  }}
  const done=ITEMS.filter(i=>ratings[i.id]).length;
  $('stats').textContent=`${done}/${ITEMS.length} rated · showing ${list.length}`;
}
['q','sort','flt','cat'].forEach(id=>$(id).addEventListener('input',render));
$('lb').onclick=()=>$('lb').style.display='none';
addEventListener('keydown',e=>{if(e.key==='Escape')$('lb').style.display='none'});
$('reset').onclick=()=>{if(confirm('Clear all ratings?')){ratings={};save();render();}};
$('csv').onclick=()=>{
  const rows=[['rating','title','url']].concat(ITEMS.map(i=>[ratings[i.id]||'',i.title,i.url]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='pokomon-ratings.csv';a.click();
};
render();
</script>
